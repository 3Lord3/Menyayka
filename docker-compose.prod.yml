# Production stack: pull pre-built images from GHCR (see .github/workflows/deploy.yml).
# On the server: copy this file + Caddyfile + backend/migrations + .env
# (see .env.deploy.example), then compose pull / migrate / up.
#
# Required env: see .env.deploy.example
# (DB_*, JWT_SECRET, S3, RESEND, DOCKER_IMAGE_PREFIX, IMAGE_TAG).
#
# image: — what CI pulls from GHCR.
# build: — the fallback path for manual builds on the VPS (compose build);
#          not used in auto-deploy (pull only there).

services:
  db:
    container_name: menyayka-db
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - menyayka-network

  migrate:
    container_name: menyayka-migrate
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - menyayka-network
    restart: "no"

  # SeaweedFS S3-compatible backend. Buckets auto-create on first request.
  seaweedfs:
    container_name: menyayka-seaweedfs
    image: chrislusf/seaweedfs:latest
    volumes:
      - seaweedfs_data:/data
    command: server -dir=/data -s3 -s3.port=9000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - menyayka-network

  tei:
    container_name: menyayka-tei
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    command: ["--model-id", "intfloat/multilingual-e5-small", "--huggingface-hub-cache", "/data"]
    volumes:
      - teidata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    networks:
      - menyayka-network

  backend:
    container_name: menyayka-backend
    image: ${DOCKER_IMAGE_PREFIX}/backend:${IMAGE_TAG}
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      tei:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - GIN_MODE=release
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - MAILER_PROVIDER=${MAILER_PROVIDER:-smtp}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-starttls}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - TEI_URL=http://tei:80
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-tei}
      - EMBEDDING_TIMEOUT=${EMBEDDING_TIMEOUT:-5s}
      - MAX_INPUT_LENGTH=${MAX_INPUT_LENGTH:-1500}
      - MATCHING_THRESHOLD=${MATCHING_THRESHOLD:-0.5}
      - CLUSTER_TOPK=${CLUSTER_TOPK:-50}
      - CLUSTER_SIMILARITY_THRESHOLD=${CLUSTER_SIMILARITY_THRESHOLD:-0.9}
      - CLUSTER_DIRECTION_MARGIN=${CLUSTER_DIRECTION_MARGIN:-0.05}
      - CYCLE_MIN_AVERAGE_SCORE=${CYCLE_MIN_AVERAGE_SCORE:-0.5}
      - CYCLE_MAX_SCORE_GAP=${CYCLE_MAX_SCORE_GAP:-1}
      - CYCLE_OUTGOING_K=${CYCLE_OUTGOING_K:-20}
      - CYCLE_MAX_DRAFTS=${CYCLE_MAX_DRAFTS:-10}
      - S3_ENDPOINT=seaweedfs:9000
      # Browser: https://<S3_PUBLIC_ENDPOINT>/items/... (Caddy handle_path /s3)
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-example.com/s3}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-items}
      - S3_USE_SSL=false
      - S3_PUBLIC_USE_SSL=true
      - RANKER_MODE=${RANKER_MODE:-ml}
      - RANKER_MODEL_PATH=${RANKER_MODEL_PATH:-/models/ranker_v1.txt}
      # Realtime WebSocket: fail-closed origin whitelist.
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-https://example.com}
      - WS_HEARTBEAT=${WS_HEARTBEAT:-30s}
      - WS_MAX_CONNS_PER_USER=${WS_MAX_CONNS_PER_USER:-5}
    restart: unless-stopped
    networks:
      - menyayka-network

  frontend:
    container_name: menyayka-frontend
    image: ${DOCKER_IMAGE_PREFIX}/frontend:${IMAGE_TAG}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-true}
    restart: unless-stopped
    networks:
      - menyayka-network

  caddy:
    container_name: menyayka-caddy
    image: caddy:2-alpine
    # Only CADDY_HTTP_PORT is exposed — TLS is terminated by the fronting
    # host proxy (nginx / Caddy / LB), so this in-cluster Caddy serves plain
    # HTTP on a single port. Set CADDY_HTTP_PORT in .env when 80 is already
    # taken on the host (e.g. by a system nginx). 443 is not bound: nothing in
    # the Caddyfile uses `https://`.
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - menyayka-network

volumes:
  pgdata:
  teidata:
  seaweedfs_data:
  caddy_data:
  caddy_config:

networks:
  menyayka-network:
    driver: bridge
