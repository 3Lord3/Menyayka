services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: menyayka-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-menyayka}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-menyayka}
      POSTGRES_DB: ${DB_NAME:-menyayka}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-menyayka} -d ${DB_NAME:-menyayka}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    command: >
      -path=/migrations
      -database=postgres://${DB_USER:-menyayka}:${DB_PASSWORD:-menyayka}@db:5432/${DB_NAME:-menyayka}?sslmode=disable
      up
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # Object storage: SeaweedFS S3-compatible backend.
  # Buckets auto-create on first request — no init container required.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    hostname: seaweedfs
    container_name: menyayka-seaweedfs
    restart: unless-stopped
    ports:
      - "${S3_PORT:-9000}:9000"
    volumes:
      - seaweedfs_data:/data
    command: server -dir=/data -s3 -s3.port=9000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: ./backend
    container_name: menyayka-app
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      DATABASE_URL: postgres://${DB_USER:-menyayka}:${DB_PASSWORD:-menyayka}@db:5432/${DB_NAME:-menyayka}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      TEI_URL: ${TEI_URL:-http://tei:80}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-stub}
      VECTOR_DIM: ${VECTOR_DIM:-384}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-2s}
      MAX_INPUT_LENGTH: ${MAX_INPUT_LENGTH:-1500}
      MATCHING_TOPK: ${MATCHING_TOPK:-20}
      MATCHING_THRESHOLD: ${MATCHING_THRESHOLD:-0.5}
      CLUSTER_TOPK: ${CLUSTER_TOPK:-50}
      CLUSTER_SIMILARITY_THRESHOLD: ${CLUSTER_SIMILARITY_THRESHOLD:-0.9}
      VECTOR_METRIC: ${VECTOR_METRIC:-cosine}
      CLUSTER_DIRECTION_MARGIN: ${CLUSTER_DIRECTION_MARGIN:-0.05}
      CYCLE_OUTGOING_K: ${CYCLE_OUTGOING_K:-20}
      CYCLE_MAX_DRAFTS: ${CYCLE_MAX_DRAFTS:-10}
      S3_ENDPOINT: seaweedfs:9000
      # The browser reaches the frontend :3000; photos are served via nginx /s3 → seaweedfs
      S3_PUBLIC_ENDPOINT: localhost:${FRONTEND_PORT:-3000}/s3
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-menyayka_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-menyayka_minio_secret}
      S3_BUCKET: ${S3_BUCKET:-items}
      S3_USE_SSL: "false"
      S3_PUBLIC_USE_SSL: "false"
      RANKER_MODE: ${RANKER_MODE:-ml}
      RANKER_MODEL_PATH: ${RANKER_MODEL_PATH:-/models/ranker_v1.txt}
      # Realtime WebSocket. Fail-closed whitelist; local dev runs on :3000 (compose) / :5173 (Vite).
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      migrate:
        condition: service_completed_successfully
      tei:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-true}
    container_name: menyayka-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      # Local all-in-one: proxies /api and /s3. In prod nginx.conf stays static-only (Caddy in front).
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - seaweedfs
    restart: unless-stopped

  tei:
    # On x86_64 the official cpu-1.9 tag is used. It has no ARM64 (Apple Silicon)
    # build (no multi-arch manifest and no versioned arm64 tag — see issue #900 in the
    # huggingface/text-embeddings-inference repo), so it must be overridden there with your own
    # .env: TEI_IMAGE=ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    container_name: menyayka-tei
    command: ["--model-id", "intfloat/multilingual-e5-small", "--huggingface-hub-cache", "/data"]
    volumes:
      - teidata:/data
    ports:
      - "${TEI_EXTERNAL_PORT:-8090}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s



volumes:
  pgdata:
  teidata:
  seaweedfs_data:
