# Lightweight stack for E2E/K6: no TEI, embeddings = stub.
# Usage:
#   docker compose -f docker-compose.e2e.yml up -d --build
#   BASE_URL=http://localhost:8080 go test -tags=e2e ./tests/e2e/ -count=1
services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: menyayka-e2e-db
    environment:
      POSTGRES_USER: menyayka
      POSTGRES_PASSWORD: menyayka
      POSTGRES_DB: menyayka
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menyayka -d menyayka"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    command: >
      -path=/migrations
      -database=postgres://menyayka:menyayka@db:5432/menyayka?sslmode=disable
      up
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: menyayka-e2e-minio
    environment:
      MINIO_ACCESS_KEY: menyayka_minio
      MINIO_SECRET_KEY: menyayka_minio_secret
    command: minio server /home/shared --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 menyayka_minio menyayka_minio_secret &&
      mc mb --ignore-existing local/items
      "
    restart: on-failure

  app:
    build: ./backend
    container_name: menyayka-e2e-app
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://menyayka:menyayka@db:5432/menyayka?sslmode=disable
      JWT_SECRET: e2e-test-secret-not-for-prod
      EMBEDDING_PROVIDER: stub
      VECTOR_DIM: "384"
      EMBEDDING_TIMEOUT: 2s
      MAX_INPUT_LENGTH: "1500"
      MATCHING_TOPK: "20"
      MATCHING_THRESHOLD: "0.5"
      CLUSTER_TOPK: "50"
      CLUSTER_SIMILARITY_THRESHOLD: "0.9"
      VECTOR_METRIC: cosine
      CLUSTER_DIRECTION_MARGIN: "0.05"
      CYCLE_OUTGOING_K: "20"
      CYCLE_MAX_DRAFTS: "10"
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: menyayka_minio
      MINIO_SECRET_KEY: menyayka_minio_secret
      MINIO_BUCKET: items
      MINIO_USE_SSL: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: on-failure
