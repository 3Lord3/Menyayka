# Lightweight stack for E2E/K6: no TEI, embeddings = stub.
# Usage:
#   docker compose -f docker-compose.e2e.yml up -d --build
#   BASE_URL=http://localhost:8080 go test -tags=e2e ./tests/e2e/ -count=1
services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: menyayka-e2e-db
    environment:
      POSTGRES_USER: menyayka
      POSTGRES_PASSWORD: menyayka
      POSTGRES_DB: menyayka
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menyayka -d menyayka"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    command: >
      -path=/migrations
      -database=postgres://menyayka:menyayka@db:5432/menyayka?sslmode=disable
      up
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # SeaweedFS S3-compatible backend. Buckets auto-create on first request.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: menyayka-e2e-seaweedfs
    command: server -dir=/data -s3 -s3.port=9000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build: ./backend
    container_name: menyayka-e2e-app
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://menyayka:menyayka@db:5432/menyayka?sslmode=disable
      JWT_SECRET: e2e-test-secret-not-for-prod
      EMBEDDING_PROVIDER: stub
      VECTOR_DIM: "384"
      EMBEDDING_TIMEOUT: 2s
      MAX_INPUT_LENGTH: "1500"
      MATCHING_TOPK: "20"
      MATCHING_THRESHOLD: "0.5"
      CLUSTER_TOPK: "50"
      CLUSTER_SIMILARITY_THRESHOLD: "0.9"
      VECTOR_METRIC: cosine
      CLUSTER_DIRECTION_MARGIN: "0.05"
      CYCLE_OUTGOING_K: "20"
      CYCLE_MAX_DRAFTS: "10"
      S3_ENDPOINT: seaweedfs:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      S3_ACCESS_KEY: menyayka_minio
      S3_SECRET_KEY: menyayka_minio_secret
      S3_BUCKET: items
      S3_USE_SSL: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    restart: on-failure
